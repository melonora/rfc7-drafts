id: https://w3id.org/ome/ngff/channel
name: OME_NGFF_Channel
version: 0.1.0
description: >-
  This schema defines the base channel of the draft OME-NGFF channel metadata RFC. The `channels` list of a
  multiscale (defined in the main OME-NGFF schema) holds one channel per index of its channel axis.
  Every channel has an id, a name and a type, and can state what its values measure, what it reports on, where it came
  from and whether it is a plane of a colour image. Typed channels are defined in the channel types schema.

prefixes:
  ome: https://w3id.org/ome/
  ngff: https://w3id.org/ome/ngff/
  linkml: https://w3id.org/linkml/
  orcid: https://orcid.org/
  xsd: http://www.w3.org/2001/XMLSchema#
imports:
  - linkml:types
default_range: string
default_prefix: ngff

created_on: "2026-11-04T00:00:00Z"
created_by: orcid:0000-0003-1666-5421

classes:
  Channel:
    unique_keys:
      name_key:
        description: Channel names are unique within the channels list.
        unique_key_slots:
          - name
    description: >
      The base channel. Every channel, whatever its type, MUST be valid as a base channel. Readers that do not
      recognise `type` MUST treat the channel as a base channel and MUST ignore attributes they do not know. Writers
      MUST NOT put rendering attributes (colour, window, lookup table) on a channel.
    attributes:
      id:
        description: >
          Identifier of the channel, unique for the multiscale. Other metadata (rendering, biological annotation,
          statistics, transformations) references the channel by this id. Follows the RFC-8 id pattern; UUIDs are
          allowed but not required.
        identifier: true
        required: true
        pattern: "^[a-zA-Z0-9\\-_.]+$"
      name:
        description: >
          Human-readable name of the channel. It MUST be unique within the `channels` list, so that a channel can be
          looked up by name.
        required: true
      type:
        description: >
          The channel type: one of the core types (fluorescence, optical, electron, scanning_probe, spectroscopic,
          diffraction, xray, computed), "generic", or an extension type given as a namespaced http(s) URI. Typed
          subclasses pin this value with equals_string; other values are invalid.
        required: true
      description:
        description: Free-text description of the channel for humans and language models.
      quantity:
        description: >
          What the stored values measure. This attribute is OPTIONAL. When absent, values are intensities in
          arbitrary units.
        range: Quantity
        inlined: true
      entities:
        description: What the channel reports on, each with its role.
        range: Entity
        multivalued: true
        inlined_as_list: true
      provenance:
        description: Whether the channel was acquired, derived or simulated, and from what.
        range: Provenance
        inlined: true
      component:
        description: Membership of a colour image stored as separate planes.
        range: Component
        inlined: true
      terms:
        description: >
          Ontology terms for the channel as a whole, e.g. an imaging-method term, as CURIEs. Prefixes SHOULD follow
          bioregistry.io.
        range: string
        pattern: "^[A-Za-z][A-Za-z0-9._+-]*:\\S+$"
        multivalued: true

  Quantity:
    description: >
      The physical quantity the stored values represent and how to calibrate them. The calibration applies to pixel
      values, not to coordinates, and is unrelated to RFC-5 scale transformations.
    attributes:
      name:
        description: >
          The measured quantity, e.g. intensity, counts, height, phase, potential, force, modulus, lifetime,
          probability, angle, concentration. Values from the recommended vocabulary SHOULD be used; other values are
          allowed.
        required: true
      unit:
        description: >
          Unit of the physical value, spelled as for axes (e.g. nanometer, volt, degree, nanosecond). This attribute
          is OPTIONAL; if it is absent, the values are in arbitrary units.
      value_scale:
        description: Linear calibration, physical = stored * value_scale + value_offset. Defaults to 1.
        range: float
        ifabsent: float(1.0)
      value_offset:
        description: Linear calibration, physical = stored * value_scale + value_offset. Defaults to 0.
        range: float
        ifabsent: float(0.0)
      categories:
        description: >
          For categorical channels such as EBSD phase maps or classifier outputs, a map from stored value to the
          category it stands for, serialized as { "<stored value>": { "name": ..., "term": ... } }.
        range: Category
        multivalued: true
        inlined_as_list: true

  Category:
    attributes:
      value:
        description: The stored pixel value.
        range: integer
        required: true
      name:
        required: true
      term:
        description: Ontology term for the category as a CURIE.
        range: string
        pattern: "^[A-Za-z][A-Za-z0-9._+-]*:\\S+$"

  Entity:
    description: >
      Something the channel reports on. The same roles apply across domains: a DAPI channel (DAPI, DNA, nucleus), an
      imaging mass cytometry channel (165Ho, CD3, T cell) and an EDS map (iron in a steel matrix).
    attributes:
      name:
        required: true
      term:
        description: Ontology or database term for the entity as a CURIE. Prefixes SHOULD follow bioregistry.io.
        range: string
        pattern: "^[A-Za-z][A-Za-z0-9._+-]*:\\S+$"
      role:
        range: EntityRole
        required: true

  Provenance:
    attributes:
      origin:
        range: Origin
        ifabsent: string(acquired)
      sources:
        description: >
          Ids of the channels this channel was derived from. Channels in other documents will be referenced with
          RFC-8 References once RFC-8 is settled.
        multivalued: true
      method:
        description: Short description of, or URI for, the method that produced the channel.

  Component:
    description: >
      Channels with the same `group` together form one colour image. A group MUST contain each component of its
      colour model exactly once.
    attributes:
      model:
        range: ColorModel
        required: true
      name:
        range: ColorComponent
        required: true
      group:
        description: Identifier shared by the channels of one colour image.
        required: true


enums:
  EntityRole:
    permissible_values:
      signal:
        description: What produces the measured signal, e.g. a fluorophore, a metal isotope tag or a stain.
      target:
        description: What the signal is bound to or reports on, e.g. a protein, DNA or an element.
      observed_entity:
        description: The structure or material seen, e.g. a nucleus, the nuclear lamina or ferrite grains.
  Origin:
    permissible_values:
      acquired:
        description: The channel was recorded by an instrument. This is the default.
      derived:
        description: The channel was computed from other channels, e.g. a projection, a deconvolution or a model output.
      simulated:
        description: The channel was produced by a simulation.
  ColorModel:
    permissible_values:
      RGB:
        description: Red, green and blue planes.
      RGBA:
        description: Red, green, blue and alpha planes.
  ColorComponent:
    permissible_values:
      R:
        description: Red plane.
      G:
        description: Green plane.
      B:
        description: Blue plane.
      A:
        description: Alpha plane.
